name: Windows app build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Package Windows app
        run: npm run dist:win
      - name: Verify packaged app startup
        shell: pwsh
        run: ./scripts/verify-windows-startup.ps1
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/Legacy-Mod-Suite-0.1.1-Windows-x64.zip
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Legacy-Mod-Suite-0.1.1-Windows-x64
          path: release/Legacy-Mod-Suite-0.1.1-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
